<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OFRR — Carrinho — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

/* Funil badge */
.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}

/* Nav tabs */
.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

/* Period controls */
.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}

/* ─── Content ────────────────────────────────────────────────────── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

/* Page header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}

/* KPIs */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}

/* Section label */
.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

/* Status legend */
.status-legend{display:flex;gap:16px;margin-bottom:14px}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Charts */
.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}

/* Tooltip */
.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Table */
table{width:100%;border-collapse:collapse}
th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
th:hover{color:var(--text)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:'JetBrains Mono',monospace}

/* Spinner */
.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1)}

/* ─── Mobile Responsive ────────────────────────────────────────── */
@media(max-width:768px){
  .app-hdr{height:auto;flex-wrap:wrap;padding:0;gap:0;align-items:stretch}
  .funil-wrap{padding:9px 14px;flex-shrink:0;border-bottom:1px solid var(--border);width:auto}
  .hdr-right{order:2;flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 14px 8px 8px;flex-wrap:nowrap;border-bottom:1px solid var(--border)}
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .hdr-tabs{order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:2px;padding:6px 14px 8px}
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .htab-icon{font-size:12px}
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}
  .g3,.g4,.g5{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}
  [style*="1fr 1fr"]{grid-template-columns:1fr!important}
  [style*="1fr 420px"]{grid-template-columns:1fr!important}
  .page div[style*="overflow:hidden"]{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  .page table{font-size:10px!important}
  .page td,.page th{padding:7px 8px!important;white-space:nowrap}
  .page td:first-child,.page th:first-child{white-space:normal;min-width:90px;max-width:140px}
  .status-legend{flex-wrap:wrap;gap:8px}
}
</style>
</head>
<body>
<header class="app-hdr">
  <div class="funil-wrap">
    <div class="funil-btn">
      <span class="funil-dot"></span>
      <div>
        <div class="funil-name">ofrr_fev26 | Carrinho</div>
        <div class="funil-status">ativo</div>
      </div>
    </div>
  </div>
  <nav class="hdr-tabs" id="hdr-tabs">
    <button class="htab htab-active" onclick="navTo('principal')">⊞ Principal</button>
    <button class="htab" onclick="navTo('vendas')">💰 Vendas</button>
    <button class="htab" onclick="navTo('anuncios')">◈ Campanhas / Anúncios</button>
    <button class="htab" onclick="navTo('resumo')">📋 Resumo diário</button>
  </nav>
  <div class="hdr-right">
    <div class="presets" id="hdr-presets">
      <button class="btn-pre" onclick="applyQuickCurrent('hoje')">Hoje</button>
      <button class="btn-pre" onclick="applyQuickCurrent('ontem')">Ontem</button>
      <button class="btn-pre" onclick="applyQuickCurrent('7d')">7 dias</button>
      <button class="btn-pre on" onclick="applyQuickCurrent('30d')">30 dias</button>
      <button class="btn-pre" onclick="applyQuickCurrent('mes')">Este mês</button>
    </div>
    <div class="drbox">
      <span class="drbox-icon">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)"/>
    </div>
  </div>
</header>

<div class="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <div id="page-principal" class="page active"></div>
  <div id="page-vendas"    class="page"></div>
  <div id="page-anuncios"  class="page"></div>
  <div id="page-resumo"    class="page"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   OFRR — Carrinho — Dashboard local
   Dados fixos, embutidos neste arquivo a partir dos CSVs exportados:
     • Base Meta      → investimento/cliques/impressões/vídeo por dia (gerenciador de anúncios)
     • Tráfego - Ficha de Interesse - OFRR - PPuMBINi   → fichas de tráfego pago
     • Disparos - Ficha de Interesse - OFRR - lebhQbV7  → fichas do orgânico
     • Vendas                                            → vendas confirmadas

   Lançamento encerrado — números finais, sem necessidade de atualização.
   Não busca nada da internet — os valores abaixo (CSV_*_B64) são fixos.
   ════════════════════════════════════════════════════════════════════════ */

// ── Meta de custo por ficha ────────────────────────────────────────────────
const META_CPL = 40; // R$ 40 por ficha (tráfego)

// Metas de mídia usadas no farol do Resumo diário (🟢 dentro / 🟡 até 10% fora / 🔴 mais de 10% fora)
const METAS_RESUMO = {
  cpc:    {val:2.55,  higher:false}, // quanto menor, melhor
  ctr:    {val:2.20,  higher:true},  // quanto maior, melhor
  cpm:    {val:56.03, higher:false}, // quanto menor, melhor
  txForm: {val:9.67,  higher:true},  // quanto maior, melhor
};

// ── Constantes fixas usadas nas métricas da aba Vendas ─────────────────────
const LISTA_LEADS_TOTAL   = 7040;   // tamanho da lista de leads considerada
const TICKET_MEDIO        = 2480;   // R$ por venda, usado no faturamento
const INVESTIMENTO_ROAS   = 35436;  // R$ investido considerado no cálculo do ROAS

// Chart colors
const CHART_INV  = "#3b82f6";
const CHART_CPL  = "#fbbf24";
const CHART_TRAF = "#34d399";
const CHART_ORG  = "#a78bfa";

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  meta:{},              // date → {spend,clicks,impressions,videoViews,video75} (totais gerais)
  metaRows:[],           // linhas planas da Base Meta: {date,adId,adName,campId,campName,spend,clicks,impressions,videoViews,video75,igUrl}
  adIdMap:{},            // adId → {adName,campName,campId,igUrl} (fonte da verdade p/ casar fichas)
  fichaAttrib:[],        // fichas de tráfego casadas com anúncio/campanha: {date,adName,campName}
  trafego:{},            // date → count (fichas tráfego)
  organico:{},           // date → count (fichas orgânico)
  vendasTraf:{},         // date → count (vendas casadas com fichas de tráfego)
  vendasOrg:{},          // date → count (vendas casadas com fichas de orgânico)
  vendasTotal:0, vendasUnmatched:0,
  startDate:"", endDate:"", activeQuick:"30d",
  currentPage:"principal",
  updated:null,
  loading:true,
  error:null,
  manualSpendHoje:null, // override manual do investimento de "hoje" (Resumo diário)
  // cross-filtering (aba Campanhas/Anúncios)
  selectedCamps:new Set(),
  selectedAds:new Set(),
  campSearch:"", adSearch:"",
  cSort:{col:"spend",dir:"desc"},
  aSort:{col:"spend",dir:"desc"},
};

// ── Date helpers (GMT-3 Brasil) ───────────────────────────────────────────
function nowBR(){ return new Date(Date.now()-(3*60*60*1000)); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowBR()); }
function yesterdayISO(){ const d=nowBR();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowBR();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowBR();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }

// ── Format helpers ────────────────────────────────────────────────────────
function parseBRL(s){
  if(!s||s==="-"||s==="0")return 0;
  s=String(s).replace(/[R$\s]/g,"").trim();
  if(!s||s==="-")return 0;
  if(s.includes(",")&&s.includes("."))return parseFloat(s.replace(/\./g,"").replace(",","."))||0;
  if(s.includes(","))return parseFloat(s.replace(",","."))||0;
  return parseFloat(s)||0;
}
function fBRL(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fBRLShort(n){ const a=Math.abs(n||0),sg=n<0?"-":"";if(a>=1000)return sg+"R$ "+(a/1000).toFixed(1).replace(".",",")+"k";return sg+"R$ "+Math.round(a); }
function fPct(n){ return (n||0).toFixed(2).replace(".",",")+"%"; }
// Normalização p/ casar venda ↔ ficha por e-mail ou telefone (ignora formatação/país/pontuação)
function normalizePhone(s){ return String(s||"").replace(/\D/g,""); }
function normalizeEmail(s){ return String(s||"").trim().toLowerCase(); }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"—";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function toISO(s){
  if(!s||s==="Date"||s==="")return null;
  s=String(s).trim().split(" ")[0];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const p=s.split("/");
  if(p.length===3){
    const y=p[2].length===4?p[2]:"20"+p[2];
    const a=parseInt(p[0]),b=parseInt(p[1]);
    if(b>12){ return `${y}-${p[0].padStart(2,"0")}-${p[1].padStart(2,"0")}`; }
    return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  }
  return null;
}
// Parser genérico de "DD/MM/YYYY HH:MM:SS" (ou "YYYY-MM-DD ...") → epoch ms (sem fuso).
// Usado tanto pra "Submitted At" das fichas (que precisa do ajuste -3h) quanto pra
// "Data Correta" das vendas (que já vem certa, sem ajuste).
function parseDateTimeMs(s){
  if(!s)return null;
  const [datePart,timePart]=String(s).trim().split(" ");
  if(!datePart)return null;
  let y,mo,da;
  if(/^\d{4}-\d{2}-\d{2}$/.test(datePart)){
    [y,mo,da]=datePart.split("-").map(Number);
  }else{
    const p=datePart.split("/");
    if(p.length!==3)return null;
    y=parseInt(p[2].length===4?p[2]:"20"+p[2]);
    const a=parseInt(p[0]),b=parseInt(p[1]);
    if(b>12){mo=a;da=b;}else{da=a;mo=b;} // DD/MM por padrão (BR), MM/DD se 2ª parte>12
  }
  if(!y||!mo||!da)return null;
  let hh=0,mi=0,ss=0;
  if(timePart){
    const t=timePart.split(":").map(n=>parseInt(n)||0);
    hh=t[0]||0;mi=t[1]||0;ss=t[2]||0;
  }
  return Date.UTC(y,mo-1,da,hh,mi,ss);
}
function msToISO(ms){
  const d=new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
// "Submitted At" das fichas vem com 3h a mais do horário real (ex: 18h na
// planilha = 15h de verdade). Esta função já desconta as 3h antes de definir
// o dia — por isso um registro "17/07 02:00" cai no dia 16/07 (23:00).
function toISOFicha(s){
  const ms=parseDateTimeMs(s);if(ms==null)return null;
  return msToISO(ms-3*60*60*1000);
}
// "Data Correta" das vendas já vem no horário certo — sem ajuste de fuso.
function toISOVenda(s){
  const ms=parseDateTimeMs(s);if(ms==null)return null;
  return msToISO(ms);
}

// ── Status helpers ────────────────────────────────────────────────────────
function statusColor(val,meta,higherIsBetter){
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.22)";
  if(c==="#fbbf24") return "rgba(251,191,36,.22)";
  if(c==="#f87171") return "rgba(248,113,113,.22)";
  return "var(--border)";
}

// ── CSV parser ────────────────────────────────────────────────────────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return {values:result};
}
function parseSheet(json){
  const rows=json.values||[];if(rows.length<2)return[];
  const h=rows[0];
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}
function b64ToUtf8(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

// ── Dados fixos (CSV embutido) ─────────────────────────────────────────────
// Gerados a partir dos arquivos exportados pra pasta local:
//  - "Fichas OFRR JUL2026 - Base Meta.csv"
//  - "Fichas OFRR JUL2026 - Tráfego - Ficha de Interesse - OFRR - PPuMBINi.csv"

// ── Load data ─────────────────────────────────────────────────────────────
function loadData(){
  S.loading=true; S.error=null; render();
  try{
    const metaRowsRaw = parseSheet(parseCSVText(b64ToUtf8(CSV_META_B64)));
    const trafRows    = parseSheet(parseCSVText(b64ToUtf8(CSV_TRAFEGO_B64)));
    const orgRows     = parseSheet(parseCSVText(b64ToUtf8(CSV_ORGANICO_B64)));
    const vendasRows  = parseSheet(parseCSVText(b64ToUtf8(CSV_VENDAS_B64)));

    // ── Fichas: Tráfego (data já ajustada -3h) ──
    const trafD={};
    for(const r of trafRows){
      const d=toISOFicha(r["Submitted At"]);if(!d)continue;
      trafD[d]=(trafD[d]||0)+1;
    }
    // ── Fichas: Orgânico (data já ajustada -3h) ──
    const orgD={};
    for(const r of orgRows){
      const d=toISOFicha(r["Submitted At"]);if(!d)continue;
      orgD[d]=(orgD[d]||0)+1;
    }

    // ── Base Meta (investimento) ── guarda linhas planas + mapa Ad ID → anúncio/campanha
    const mD={}, metaRows=[], adIdMap={};
    for(const r of metaRowsRaw){
      const d=toISO(r["Date"]);if(!d)continue;
      const sp=parseBRL(r["Spend (Cost, Amount Spent)"]);
      const cl=parseInt(r["Action Link Clicks"]||0)||0;
      const im=parseInt(r["Impressions"]||0)||0;
      const vv=parseInt(r["Action Video View"]||0)||0;
      const v75=parseInt(r["Video 75 Percent Watched Actions"]||0)||0;
      const lv=parseInt(r["Action Landing Page View"]||0)||0;
      const adId=(r["Ad ID"]||"").trim();
      const adName=(r["Ad Name"]||"").trim();
      const campId=(r["Campaign ID"]||"").trim();
      const campName=(r["Campaign Name"]||"").trim();
      const igUrl=(r["Instagram Permalink URL"]||"").trim();

      if(!mD[d])mD[d]={spend:0,clicks:0,impressions:0,videoViews:0,video75:0,landingViews:0};
      mD[d].spend+=sp;mD[d].clicks+=cl;mD[d].impressions+=im;mD[d].videoViews+=vv;mD[d].video75+=v75;mD[d].landingViews+=lv;

      metaRows.push({date:d,adId,adName,campId,campName,spend:sp,clicks:cl,impressions:im,videoViews:vv,video75:v75,landingViews:lv,igUrl});

      if(adId&&!adIdMap[adId])adIdMap[adId]={adName,campName,campId,igUrl};
      if(adId&&igUrl&&!adIdMap[adId].igUrl)adIdMap[adId].igUrl=igUrl;
    }

    // ── Casar fichas de tráfego → anúncio/campanha ──
    // Padrão de UTM do Meta Ads: utm_medium = "{nome campanha}id{campaign_id}"
    //                            utm_content = "{nome anúncio}id{ad_id}"
    // Prioridade: resolver pelo Ad ID batido na Base Meta (fonte da verdade — cobre o
    // caso do mesmo anúncio existir em campanhas diferentes com Ad IDs diferentes).
    // Se o Ad ID ainda não apareceu na Base Meta, cai no nome cru extraído da UTM.
    const fichaAttrib=[];
    for(const r of trafRows){
      const d=toISOFicha(r["Submitted At"]);if(!d)continue;
      const utmMed=(r["utm_medium"]||"").trim();
      const utmCont=(r["utm_content"]||r["utm_term"]||"").trim();
      const adIdMatch=utmCont.match(/id(\d{10,})$/);
      const rawAdId=adIdMatch?adIdMatch[1]:null;
      const adNameMatch=utmCont.match(/^(.+?)id\d{10,}$/);
      const rawAdName=adNameMatch?adNameMatch[1]:(utmCont||null);
      const campMatch=utmMed.match(/^(.+?)id\d+$/);
      const rawCampName=campMatch?campMatch[1]:(utmMed||null);

      let adName=rawAdName, campName=rawCampName;
      if(rawAdId&&adIdMap[rawAdId]){
        adName=adIdMap[rawAdId].adName||rawAdName;
        campName=adIdMap[rawAdId].campName||rawCampName;
      }
      if(!adName&&!campName)continue;
      fichaAttrib.push({date:d,adName:adName||"(sem anúncio)",campName:campName||"(sem campanha)"});
    }

    // ── Vendas → casar com tráfego ou orgânico via e-mail/telefone ──
    // Uma venda é atribuída à ficha (tráfego ou orgânico) que a pessoa preencheu
    // PRIMEIRO — ou seja, entre todas as fichas que batem com o e-mail/telefone da
    // venda (em qualquer uma das duas abas), pega a de "Submitted At" mais antigo e
    // usa a origem dela. Isso cobre o caso de alguém preencher no orgânico e depois
    // preencher de novo vindo do tráfego: a venda continua sendo do orgânico.
    const earliestByPhone={}, earliestByEmail={};
    function noteFicha(type,phone,email,ms){
      if(ms==null)return;
      if(phone&&(!earliestByPhone[phone]||ms<earliestByPhone[phone].ms))earliestByPhone[phone]={type,ms};
      if(email&&(!earliestByEmail[email]||ms<earliestByEmail[email].ms))earliestByEmail[email]={type,ms};
    }
    for(const r of trafRows){
      noteFicha("traf",normalizePhone(r["Qual seu WhatsApp?"]),normalizeEmail(r["Qual seu E-mail?"]),parseDateTimeMs(r["Submitted At"]));
    }
    for(const r of orgRows){
      noteFicha("org",normalizePhone(r["Qual seu WhatsApp?"]),normalizeEmail(r["Qual seu E-mail?"]),parseDateTimeMs(r["Submitted At"]));
    }
    const vTrafD={}, vOrgD={};
    let vTotal=0, vUnmatched=0;
    for(const r of vendasRows){
      const d=toISOVenda(r["Data Correta"]);if(!d)continue;
      const ph=normalizePhone(r["Whatsapp1"]);
      const em=normalizeEmail(r["Email"]);
      vTotal++;
      const candidates=[];
      if(ph&&earliestByPhone[ph])candidates.push(earliestByPhone[ph]);
      if(em&&earliestByEmail[em])candidates.push(earliestByEmail[em]);
      if(candidates.length){
        candidates.sort((a,b)=>a.ms-b.ms);
        const bucket=candidates[0].type;
        if(bucket==="traf")vTrafD[d]=(vTrafD[d]||0)+1;
        else vOrgD[d]=(vOrgD[d]||0)+1;
      }else{
        vUnmatched++;
      }
    }

    S.trafego=trafD; S.organico=orgD;
    S.meta=mD; S.metaRows=metaRows; S.adIdMap=adIdMap; S.fichaAttrib=fichaAttrib;
    S.vendasTraf=vTrafD; S.vendasOrg=vOrgD; S.vendasTotal=vTotal; S.vendasUnmatched=vUnmatched;

    const allDates=[...new Set([...Object.keys(mD),...Object.keys(trafD),...Object.keys(orgD)])].sort();
    S.updated=allDates.length?fDateBR(allDates[allDates.length-1]):"—";

    if(!S.startDate){ S.startDate=nDaysAgoISO(29);S.endDate=todayISO();S.activeQuick="30d"; }
  }catch(e){
    S.error="Erro ao carregar os dados embutidos: "+e.message;
    console.error(e);
  }
  S.loading=false;
  render();
}

// ── Derived metrics ───────────────────────────────────────────────────────
function getDaily(start,end){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.trafego),...Object.keys(S.organico)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=S.meta[date]||{spend:0};
    const traf=S.trafego[date]||0;
    const org=S.organico[date]||0;
    return{date,label:fDate(date),spend:m.spend||0,trafficLeads:traf,organicLeads:org,
      cpl:traf>0?(m.spend||0)/traf:0};
  });
}
function getTotals(daily){
  return daily.reduce((a,d)=>({
    spend:a.spend+d.spend,
    trafficLeads:a.trafficLeads+d.trafficLeads,
    organicLeads:a.organicLeads+d.organicLeads,
  }),{spend:0,trafficLeads:0,organicLeads:0});
}
// s,e = null → todo o período (all-time)
function periodTotals(s,e){
  const dates=new Set([...Object.keys(S.trafego),...Object.keys(S.organico),...Object.keys(S.meta)]);
  let traf=0,org=0,spend=0,clicks=0,impressions=0,landingViews=0;
  for(const d of dates){
    if(s!==null&&d<s)continue;
    if(e!==null&&d>e)continue;
    traf+=S.trafego[d]||0;
    org+=S.organico[d]||0;
    const m=S.meta[d];
    if(m){ spend+=m.spend||0; clicks+=m.clicks||0; impressions+=m.impressions||0; landingViews+=m.landingViews||0; }
  }
  return{traf,org,spend,clicks,impressions,landingViews,
    cpl:traf>0?spend/traf:0,
    cpc:clicks>0?spend/clicks:0,
    ctr:impressions>0?(clicks/impressions)*100:0,
    cpm:impressions>0?(spend/impressions)*1000:0,
    // Tx conversão formulário = fichas reais de tráfego / page views da landing
    txForm:landingViews>0?(traf/landingViews)*100:0};
}
// ── Campanhas / Anúncios: agregação com cross-filtering ───────────────────
function getMetaRowsInRange(start,end){
  return S.metaRows.filter(r=>r.date>=start&&r.date<=end);
}
function getFichasForCamp(start,end,campName){
  let n=0;
  for(const f of S.fichaAttrib){ if(f.date>=start&&f.date<=end&&f.campName===campName)n++; }
  return n;
}
// campFilter: Set de nomes de campanha (ou null/vazio = não filtra, soma todas as campanhas do anúncio)
function getFichasForAd(start,end,adName,campFilter){
  let n=0;
  for(const f of S.fichaAttrib){
    if(f.date<start||f.date>end)continue;
    if(f.adName!==adName)continue;
    if(campFilter&&campFilter.size>0&&!campFilter.has(f.campName))continue;
    n++;
  }
  return n;
}
function getCampRows(start,end){
  const rows=getMetaRowsInRange(start,end);
  const byCamp={};
  for(const r of rows){
    const cn=r.campName||"(sem campanha)";
    if(!byCamp[cn])byCamp[cn]={campName:cn,spend:0,clicks:0,impressions:0,videoViews:0,video75:0};
    byCamp[cn].spend+=r.spend;byCamp[cn].clicks+=r.clicks;byCamp[cn].impressions+=r.impressions;
    byCamp[cn].videoViews+=r.videoViews;byCamp[cn].video75+=r.video75;
  }
  return Object.values(byCamp).map(c=>{
    const leads=getFichasForCamp(start,end,c.campName);
    return {...c,leads,
      cpc:c.clicks>0?c.spend/c.clicks:0, ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      cpm:c.impressions>0?(c.spend/c.impressions)*1000:0, cpl:leads>0?c.spend/leads:0};
  });
}
// selectedCamps: Set — quando vazio, consolida o anúncio em TODAS as campanhas onde ele aparece
// (mesmo nome, IDs diferentes); quando preenchido, restringe investimento e fichas só àquela(s) campanha(s).
function getAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=getMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName));
  const byAd={};
  for(const r of rows){
    const an=r.adName||"(sem anúncio)";
    if(!byAd[an])byAd[an]={adName:an,spend:0,clicks:0,impressions:0,videoViews:0,video75:0,igUrl:"",camps:new Set()};
    byAd[an].spend+=r.spend;byAd[an].clicks+=r.clicks;byAd[an].impressions+=r.impressions;
    byAd[an].videoViews+=r.videoViews;byAd[an].video75+=r.video75;
    if(!byAd[an].igUrl&&r.igUrl)byAd[an].igUrl=r.igUrl;
    if(r.campName)byAd[an].camps.add(r.campName);
  }
  return Object.values(byAd).map(a=>{
    const leads=getFichasForAd(start,end,a.adName,hasSel?selectedCamps:null);
    return {...a,leads,campNames:[...a.camps].join(", "),
      cpc:a.clicks>0?a.spend/a.clicks:0, ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      cpm:a.impressions>0?(a.spend/a.impressions)*1000:0, cpl:leads>0?a.spend/leads:0};
  });
}

// ── Canvas / Chart helpers ────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  cssW=Math.max(cssW,50);cssH=Math.max(cssH,50);
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}

// Dual-axis: Investimento (esq.) × Custo/ficha (dir.)
function drawDualInvCpl(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpl||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,META_CPL,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v)/(lMax))*cH;
  const yPR=v=>P.t+cH-((v)/(rMax))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  const mY=yPR(META_CPL);
  ctx.strokeStyle=CHART_CPL+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=CHART_CPL;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
  ctx.fillText("Meta R$"+META_CPL,P.l+cW+4,mY-3);
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPL,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

function drawBars(ctx,xP,yP,yZero,vals,color,barW){
  vals.forEach((v,i)=>{
    const x=xP(i)-barW/2, y=Math.min(yP(v),yZero), h=Math.abs(yP(v)-yZero);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,Math.max(h,v>0?1:0));
  });
}
// Barras de uma série só — usado nos gráficos de "Fichas por dia" (tráfego / orgânico)
function drawBarSingle(id,data,key,color,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,color,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const escName=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");

  const campRowsAll=getCampRows(start,end);
  const _cq=S.campSearch.trim().toLowerCase();
  const campRows=_cq?campRowsAll.filter(c=>c.campName.toLowerCase().includes(_cq)):campRowsAll;
  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });

  const adRowsAll=getAdRows(start,end,S.selectedCamps);
  const _aq=S.adSearch.trim().toLowerCase();
  const adRowsF=_aq?adRowsAll.filter(a=>a.adName.toLowerCase().includes(_aq)):adRowsAll;
  const {col,dir}=S.aSort;
  const sortedAds=[...adRowsF].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });

  const tot=campRowsAll.reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,impressions:a.impressions+c.impressions,leads:a.leads+c.leads}),{spend:0,clicks:0,impressions:0,leads:0});
  const totCpl=tot.leads>0?tot.spend/tot.leads:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;

  const selAds=sortedAds.filter(a=>S.selectedAds.has(a.adName));
  const adResumoText=selAds.length>0?selAds.map(a=>adResumoBlock(a)).join("\n"):"";
  el._adResumoText=adResumoText;

  function thC(colKey,lbl,isCamp){
    const aC=isCamp?cCol:col, aD=isCamp?cDir:dir, active=aC===colKey;
    const arrow=active?(aD==="asc"?" ↑":" ↓"):" ↕";
    const fn=isCamp?`sortCampanhas('${colKey}')`:`sortAnuncios('${colKey}')`;
    return `<th onclick="${fn}" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas / Anúncios</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${sortedCamps.length} campanhas · ${sortedAds.length} anúncios${S.selectedCamps.size>0?` · filtrado por ${S.selectedCamps.size} campanha(s)`:""}</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Investimento",fBRL(tot.spend),"Base Meta","var(--text-strong)")}
      ${kpiCard("Fichas",tot.leads.toLocaleString("pt-BR"),"tráfego atribuído a anúncio","var(--text-strong)")}
      ${kpiCard("Custo/ficha",totCpl>0?fBRL(totCpl):"—",`meta ${fBRL(META_CPL)}`,totCpl>0?statusColor(totCpl,META_CPL,false):"var(--text-strong)",false,totCpl,META_CPL,false)}
      ${kpiCard("CTR",fPct(totCtr),"","var(--text-strong)")}
    </div>

// ── Render: Vendas ─────────────────────────────────────────────────────────
function getDailyVendas(start,end){
  const allDates=new Set([...Object.keys(S.vendasTraf),...Object.keys(S.vendasOrg)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>({
    date,label:fDate(date),
    vendasTraf:S.vendasTraf[date]||0,
    vendasOrg:S.vendasOrg[date]||0,
  }));
}
function renderVendas(){
  const el=document.getElementById("page-vendas");if(!el)return;
  const daily=getDailyVendas(S.startDate,S.endDate);
  const totTraf=daily.reduce((a,d)=>a+d.vendasTraf,0);
  const totOrg=daily.reduce((a,d)=>a+d.vendasOrg,0);

  // Métricas de conversão/faturamento — sempre sobre o total de vendas (todo o período)
  const totalFichasAllTime=Object.values(S.trafego).reduce((a,b)=>a+b,0)+Object.values(S.organico).reduce((a,b)=>a+b,0);
  const convLista  = LISTA_LEADS_TOTAL>0 ? (S.vendasTotal/LISTA_LEADS_TOTAL)*100 : 0;
  const convFichas = totalFichasAllTime>0 ? (S.vendasTotal/totalFichasAllTime)*100 : 0;
  const faturamento= S.vendasTotal*TICKET_MEDIO;
  const roas       = INVESTIMENTO_ROAS>0 ? faturamento/INVESTIMENTO_ROAS : 0;

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Vendas</div>
        <div class="hdr-sub">atualizado em: ${S.updated||"—"}${daily.length>0?` · ${daily.length} dias no período`:""} · atribuição por e-mail/telefone da ficha</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Vendas (total)",S.vendasTotal.toLocaleString("pt-BR"),"todo o período","var(--text-strong)")}
      ${kpiCard("Vendas tráfego",totTraf.toLocaleString("pt-BR"),"no período selecionado","var(--text-strong)")}
      ${kpiCard("Vendas orgânico",totOrg.toLocaleString("pt-BR"),"no período selecionado","var(--text-strong)")}
      ${kpiCard("Não identificadas",S.vendasUnmatched.toLocaleString("pt-BR"),"sem ficha correspondente","var(--muted)")}
    </div>
    <div class="g4" style="margin-bottom:16px">
      ${kpiCard("Conversão lista em vendas",fPct(convLista),`${S.vendasTotal} / ${LISTA_LEADS_TOTAL.toLocaleString("pt-BR")} leads`,"var(--text-strong)")}
      ${kpiCard("Conversão fichas em vendas",fPct(convFichas),`${S.vendasTotal} / ${totalFichasAllTime.toLocaleString("pt-BR")} fichas`,"var(--text-strong)")}
      ${kpiCard("Faturamento",fBRL(faturamento),`${S.vendasTotal} × ${fBRL(TICKET_MEDIO)}`,"var(--text-strong)")}
      ${kpiCard("ROAS",roas.toFixed(2).replace(".",",")+"x",`${fBRL(faturamento)} / ${fBRL(INVESTIMENTO_ROAS)}`,"var(--text-strong)")}
    </div>
    <div class="cc" style="position:relative;margin-bottom:12px">
      <div class="ch">
        <span class="ct">Vendas por dia — Tráfego</span>
        <div class="lg"><span class="li"><span class="ld" style="background:${CHART_TRAF}"></span>Vendas/dia</span></div>
      </div>
      <div style="position:relative"><canvas id="c-vendas-traf"></canvas><div class="tip" id="t-vendas-traf"></div></div>
    </div>
    <div class="cc" style="position:relative">
      <div class="ch">
        <span class="ct">Vendas por dia — Orgânico</span>
        <div class="lg"><span class="li"><span class="ld" style="background:${CHART_ORG}"></span>Vendas/dia</span></div>
      </div>
      <div style="position:relative"><canvas id="c-vendas-org"></canvas><div class="tip" id="t-vendas-org"></div></div>
    </div>
    ${daily.length===0?`<div class="err" style="margin-top:12px">Nenhuma venda no período selecionado.</div>`:""}
    <div class="foot">OFRR · Carrinho · dados locais (CSV embutido)</div>`;
  requestAnimationFrame(()=>{
    const box1=document.getElementById("c-vendas-traf")?.parentElement;
    if(box1)drawBarSingle("c-vendas-traf",daily,"vendasTraf",CHART_TRAF,box1.clientWidth,200);
    const box2=document.getElementById("c-vendas-org")?.parentElement;
    if(box2)drawBarSingle("c-vendas-org",daily,"vendasOrg",CHART_ORG,box2.clientWidth,200);
    setupTip("c-vendas-traf","t-vendas-traf",daily,[{name:"Vendas tráfego",color:CHART_TRAF,key:"vendasTraf",fmt:v=>String(v)}],40,12);
    setupTip("c-vendas-org","t-vendas-org",daily,[{name:"Vendas orgânico",color:CHART_ORG,key:"vendasOrg",fmt:v=>String(v)}],40,12);
  });
}

// ── Render: Resumo diário ──────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const _fid=document.activeElement?.id; // capturar antes do innerHTML destruir o foco
  const today=todayISO(), yest=yesterdayISO();

  const ontem=periodTotals(yest,yest);
  const hojeRaw=periodTotals(today,today); // valor "cru" vindo da Base Meta, antes de qualquer override manual
  const isManual=S.manualSpendHoje!==null;

  // "Hoje": se houver override manual, usa o valor digitado no lugar do investimento da Base Meta
  // (CPC/CPM ficam estáticos, com base no investimento bruto da Base Meta — só Custo/ficha recalcula)
  const hoje=isManual
    ? {...hojeRaw, spend:S.manualSpendHoje,
        cpl:hojeRaw.traf>0?S.manualSpendHoje/hojeRaw.traf:0}
    : hojeRaw;

  // "Total - Consolidado": soma tudo, mas troca a fatia de "hoje" pelo valor manual quando houver override
  // (CPC/CPM do consolidado também ficam estáticos, com base no investimento bruto)
  let tot=periodTotals(null,null);
  if(isManual){
    const adjSpend=tot.spend-hojeRaw.spend+S.manualSpendHoje;
    tot={...tot, spend:adjSpend,
      cpl:tot.traf>0?adjSpend/tot.traf:0};
  }

  function cplInfo(m,isHoje){
    if(!m.traf) return {txt:isHoje?"--!":"--", emoji:"🔴"};
    const ratio=META_CPL/m.cpl;
    let emoji="🔴";
    if(ratio>=1)emoji="🟢";else if(ratio>=0.85)emoji="🟡";
    return {txt:fBRL(m.cpl),emoji};
  }
  // Farol das metas de mídia: 🟢 dentro da meta / 🟡 até 10% fora / 🔴 mais de 10% fora
  function metaEmoji(val,meta,higherIsBetter){
    if(!val) return "🔴";
    const c=statusColor(val,meta,higherIsBetter);
    if(c==="#34d399")return "🟢";
    if(c==="#fbbf24")return "🟡";
    return "🔴";
  }

  function row(lbl,val,metaStr,emoji){
    return `<div style="display:grid;grid-template-columns:180px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-strong)">${val}</span>
      <span style="font-size:14px;min-width:90px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
    </div>`;
  }
  function investRowHoje(){
    return `<div style="display:grid;grid-template-columns:180px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">Investimento</span>
      <input id="manual-spend-input"
        value="${isManual?(hoje.spend||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}"
        placeholder="${fBRL(hojeRaw.spend)}"
        inputmode="decimal"
        oninput="setManualSpendHoje(this.value)"
        onkeydown="if(event.key==='Enter')this.blur()"
        style="font-family:'JetBrains Mono',monospace;font-size:13px;color:${isManual?'#fbbf24':'var(--text-strong)'};background:transparent;border:none;border-bottom:1px solid ${isManual?'rgba(251,191,36,.4)':'rgba(255,255,255,.15)'};outline:none;padding:2px 0;width:100%"/>
      <span style="font-size:11px;min-width:90px;text-align:right">
        ${isManual?`<button onclick="clearManualSpendHoje()" style="font-size:10px;padding:3px 9px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fbbf24;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:""}
      </span>
    </div>`;
  }
  function block(title,m,isHoje,dateLbl){
    const c=cplInfo(m,isHoje);
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;font-weight:700;color:var(--text-strong)">${title}</span>
        ${dateLbl?`<span style="font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace">${dateLbl}</span>`:""}
      </div>
      ${row("Fichas (tráfego)",m.traf,"","")}
      <div style="height:6px"></div>
      ${isHoje?investRowHoje():row("Investimento",fBRL(m.spend),"","")}
      ${row("Custo/ficha",c.txt,`meta ${fBRL(META_CPL)}`,c.emoji)}
      <div style="height:10px"></div>
      ${row("CPC",fBRL(m.cpc),`meta ${fBRL(METAS_RESUMO.cpc.val)}`,metaEmoji(m.cpc,METAS_RESUMO.cpc.val,METAS_RESUMO.cpc.higher))}
      ${row("CTR",fPct(m.ctr),`meta ${METAS_RESUMO.ctr.val}%`,metaEmoji(m.ctr,METAS_RESUMO.ctr.val,METAS_RESUMO.ctr.higher))}
      ${row("CPM",fBRL(m.cpm),`meta ${fBRL(METAS_RESUMO.cpm.val)}`,metaEmoji(m.cpm,METAS_RESUMO.cpm.val,METAS_RESUMO.cpm.higher))}
      ${row("Tx conversão formulário",fPct(m.txForm),`meta ${METAS_RESUMO.txForm.val}%`,metaEmoji(m.txForm,METAS_RESUMO.txForm.val,METAS_RESUMO.txForm.higher))}
    </div>`;
  }

  const ct=cplInfo(tot), co=cplInfo(ontem), ch_=cplInfo(hoje,true);
  function textBlock(label,m,dateLbl,c){
    return `${label}${dateLbl?`\t${dateLbl}`:""}

Fichas:\t${m.traf}

Investimento:\t${fBRL(m.spend)}
Custo/ ficha:\t${c.txt}\t${c.emoji} (meta: ${fBRL(META_CPL)})

CPC:\t${fBRL(m.cpc)}\t${metaEmoji(m.cpc,METAS_RESUMO.cpc.val,METAS_RESUMO.cpc.higher)} (meta: ${fBRL(METAS_RESUMO.cpc.val)})
CTR:\t${fPct(m.ctr)}\t${metaEmoji(m.ctr,METAS_RESUMO.ctr.val,METAS_RESUMO.ctr.higher)} (meta: ${METAS_RESUMO.ctr.val}%)
CPM:\t${fBRL(m.cpm)}\t${metaEmoji(m.cpm,METAS_RESUMO.cpm.val,METAS_RESUMO.cpm.higher)} (meta: ${fBRL(METAS_RESUMO.cpm.val)})
Tx conversão formulário:\t${fPct(m.txForm)}\t${metaEmoji(m.txForm,METAS_RESUMO.txForm.val,METAS_RESUMO.txForm.higher)} (meta: ${METAS_RESUMO.txForm.val}%)`;
  }
  const resumoText=
`ofrr_fev26 | Carrinho

${textBlock("Total - Consolidado",tot,"",ct)}
---------------------
${textBlock("Ontem",ontem,fDateBR(yest),co)}
---------------------
${textBlock("Hoje",hoje,fDateBR(today),ch_)}`;

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário</div>
        <div class="hdr-sub">ofrr_fev26 · Carrinho · ontem: ${fDateBR(yest)} · hoje: ${fDateBR(today)} · considera apenas fichas de tráfego</div>
      </div>
      <button onclick="copyResumo()" class="btn-copy-resumo" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif">
        📋 Copiar resumo
      </button>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start">
      <div>
        ${block("📶 Total - Consolidado",tot,false)}
        ${block("⬅️ Ontem",ontem,false,fDateBR(yest))}
        ${block("⬇️ Hoje",hoje,true,fDateBR(today))}
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;position:sticky;top:70px">
        <pre id="resumo-preview" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${resumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
      </div>
    </div>
    <div class="foot">OFRR · Carrinho · dados locais (CSV embutido)</div>`;
  el._resumoText=resumoText;
  if(_fid==="manual-spend-input"){
    requestAnimationFrame(()=>{
      const _s=document.getElementById("manual-spend-input");
      if(_s){_s.focus();const _l=_s.value.length;_s.setSelectionRange(_l,_l);}
    });
  }
}
function setManualSpendHoje(v){
  const n=parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",","."));
  S.manualSpendHoje=(isNaN(n)||n<=0)?null:n;
  renderResumo();
}
function clearManualSpendHoje(){S.manualSpendHoje=null;renderResumo();}
function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    document.querySelectorAll(".btn-copy-resumo").forEach(b=>{
      const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";
      setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);
    });
  }).catch(()=>alert("Não foi possível copiar. Selecione o texto manualmente."));
}

// ── Main render ───────────────────────────────────────────────────────────
function render(){
  const loadingEl=document.getElementById("loading");
  if(loadingEl)loadingEl.style.display=S.loading?"flex":"none";
  document.querySelectorAll(".page").forEach(el=>{el.style.display=(el.classList.contains("active")&&!S.loading)?"block":"none";});
  if(S.loading)return;
  renderHeader();
  if(S.currentPage==="principal")renderPrincipal();
  else if(S.currentPage==="anuncios")renderAnuncios();
  else if(S.currentPage==="vendas")renderVendas();
  else if(S.currentPage==="resumo")renderResumo();
}

loadData();
</script>
