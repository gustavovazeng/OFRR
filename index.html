<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OFRR — Dashboards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;height:100%;overflow:hidden}
#switcher-hdr{position:fixed;top:0;left:0;right:0;z-index:1000;height:44px;background:rgba(12,17,28,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px}
.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;user-select:none}
.funil-btn:hover{border-color:var(--border-h)}
.funil-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;letter-spacing:.04em}
.funil-caret{margin-left:2px;color:var(--hint);font-size:9px;transition:transform .15s}
.funil-btn.open .funil-caret{transform:rotate(180deg)}
#funil-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--card);
  border:1px solid var(--border-h);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);
  padding:6px;display:none;z-index:1001}
#funil-menu.open{display:block}
.funil-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer}
.funil-opt:hover{background:var(--surf)}
.funil-opt.active{background:var(--accent-bg)}
.funil-opt-txt{display:flex;flex-direction:column;gap:2px}
.funil-opt-name{font-size:12.5px;font-weight:600;color:var(--text-strong)}
.funil-opt-sub{font-size:10px;color:var(--hint)}
#frame-wrap{position:fixed;top:44px;left:0;right:0;bottom:0}
#frame-wrap iframe{width:100%;height:100%;border:0;display:none;background:var(--bg)}
#frame-wrap iframe.active{display:block}
#loading-note{font-size:10px;color:var(--hint);margin-left:12px}
</style>
</head>
<body>

<header id="switcher-hdr">
  <div class="funil-wrap">
    <div class="funil-btn" id="funil-btn" onclick="toggleFunilMenu()">
      <span class="funil-dot" id="funil-dot" style="background:var(--green)"></span>
      <div>
        <div class="funil-name" id="funil-name">ofrr_ago26 · Captação/Carrinho</div>
        <div class="funil-status" id="funil-status" style="color:var(--green)">ativo</div>
      </div>
      <span class="funil-caret">▾</span>
    </div>
    <div id="funil-menu">
      <div class="funil-opt active" id="opt-ago26" onclick="event.stopPropagation();selectDash('ago26')">
        <span class="funil-dot" style="background:var(--green)"></span>
        <div class="funil-opt-txt">
          <div class="funil-opt-name">ofrr_ago26 · Captação/Carrinho</div>
          <div class="funil-opt-sub">lançamento ativo — dados ao vivo</div>
        </div>
      </div>
      <div class="funil-opt" id="opt-jul26" onclick="event.stopPropagation();selectDash('jul26')">
        <span class="funil-dot" style="background:var(--amber)"></span>
        <div class="funil-opt-txt">
          <div class="funil-opt-name">ofrr_jul26 · Debriefing</div>
          <div class="funil-opt-sub">lançamento anterior — snapshot estático</div>
        </div>
      </div>
    </div>
  </div>
  <span id="loading-note"></span>
</header>

<div id="frame-wrap">
  <iframe id="frame-ago26" class="active" title="ofrr_ago26"></iframe>
  <iframe id="frame-jul26" title="ofrr_jul26"></iframe>
</div>

<script>
const DASH_META = {
  ago26: {name:"ofrr_ago26 · Captação/Carrinho", status:"ativo", color:"var(--green)", frame:"frame-ago26", b64id:"b64-ago26"},
  jul26: {name:"ofrr_jul26 · Debriefing", status:"snapshot estático", color:"var(--amber)", frame:"frame-jul26", b64id:"b64-jul26"}
};
const loaded = {ago26:false, jul26:false};
let current = "ago26";

function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split("").map(function(c){
    return "%"+("00"+c.charCodeAt(0).toString(16)).slice(-2);
  }).join(""));
}

function ensureLoaded(key){
  if(loaded[key])return;
  const note=document.getElementById("loading-note");
  note.textContent="carregando "+key+"…";
  const b64=document.getElementById(DASH_META[key].b64id).textContent;
  const html=b64DecodeUnicode(b64);
  document.getElementById(DASH_META[key].frame).srcdoc=html;
  loaded[key]=true;
  note.textContent="";
}

function toggleFunilMenu(){
  document.getElementById("funil-menu").classList.toggle("open");
  document.getElementById("funil-btn").classList.toggle("open");
}
function closeFunilMenu(){
  document.getElementById("funil-menu").classList.remove("open");
  document.getElementById("funil-btn").classList.remove("open");
}
document.addEventListener("click",(e)=>{
  const wrap=document.querySelector(".funil-wrap");
  if(!wrap.contains(e.target))closeFunilMenu();
});
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape")closeFunilMenu(); });

function selectDash(key){
  if(key===current){ closeFunilMenu(); return; }
  ensureLoaded(key);
  document.querySelectorAll("#frame-wrap iframe").forEach(f=>f.classList.remove("active"));
  document.getElementById(DASH_META[key].frame).classList.add("active");
  document.querySelectorAll(".funil-opt").forEach(o=>o.classList.remove("active"));
  document.getElementById("opt-"+key).classList.add("active");
  document.getElementById("funil-name").textContent=DASH_META[key].name;
  document.getElementById("funil-status").textContent=DASH_META[key].status;
  document.getElementById("funil-status").style.color=DASH_META[key].color;
  document.getElementById("funil-dot").style.background=DASH_META[key].color;
  current=key;
  closeFunilMenu();
}

// Carrega o dashboard ativo (ago26) assim que a página abre. Precisa esperar
// o DOM terminar de parsear, pois os blocos <script type="text/plain"> com o
// HTML em base64 só existem no fim do documento (depois deste <script>).
document.addEventListener("DOMContentLoaded", ()=>ensureLoaded("ago26"));
</script>
