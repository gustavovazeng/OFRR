<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OFRR — Captação — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}

.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}
.btn-update{background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;box-shadow:0 0 16px rgba(59,130,246,.2)}
.btn-update:hover:not(:disabled){box-shadow:0 0 16px rgba(59,130,246,.4)}
.btn-update:disabled{opacity:.4;cursor:not-allowed}

.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}
.notice{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:10px 16px;margin-bottom:18px;font-size:12px;color:var(--amber);line-height:1.5}

.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}

.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

.status-legend{display:flex;gap:16px;margin-bottom:14px}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}

.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

table{width:100%;border-collapse:collapse}
th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
th:hover{color:var(--text)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:'JetBrains Mono',monospace}

.bar-row{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;padding:5px 0;font-size:11px}
.bar-track{height:8px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden}
.bar-fill{height:100%;border-radius:4px}

.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1)}

@media(max-width:768px){
  .app-hdr{height:auto;flex-wrap:wrap;padding:0;gap:0;align-items:stretch}
  .funil-wrap{padding:9px 14px;flex-shrink:0;border-bottom:1px solid var(--border);width:auto}
  .hdr-right{order:2;flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 14px 8px 8px;flex-wrap:nowrap;border-bottom:1px solid var(--border)}
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .btn-update{font-size:11px;padding:5px 10px;flex-shrink:0}
  .hdr-tabs{order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:2px;padding:6px 14px 8px}
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .htab-icon{font-size:12px}
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}
  .g2,.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}
  [style*="1fr 1fr"]{grid-template-columns:1fr!important}
  [style*="1fr 420px"]{grid-template-columns:1fr!important}
  .page div[style*="overflow:hidden"]{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  .page table{font-size:10px!important}
  .page td,.page th{padding:7px 8px!important;white-space:nowrap}
  .page td:first-child,.page th:first-child{white-space:normal;min-width:90px;max-width:140px}
  .status-legend{flex-wrap:wrap;gap:8px}
  .bar-row{grid-template-columns:100px 1fr 46px}
}
</style>
</head>
<body>
<header class="app-hdr">
  <div class="funil-wrap">
    <div class="funil-btn">
      <span class="funil-dot"></span>
      <div>
        <div class="funil-name">ofrr_ago26 | Captação</div>
        <div class="funil-status">ativo</div>
      </div>
    </div>
  </div>
  <nav class="hdr-tabs" id="hdr-tabs">
    <button class="htab htab-active" onclick="navTo('captacao')">⊞ Captação</button>
    <button class="htab" onclick="navTo('aquecimento')">🔥 Aquecimento</button>
    <button class="htab" onclick="navTo('lembrete')">🔔 Lembrete</button>
    <button class="htab" onclick="navTo('aulas')">🎓 Aulas</button>
    <button class="htab" onclick="navTo('carrinho')">🛒 Carrinho</button>
    <button class="htab" onclick="navTo('planoreal')">📈 Planejado/Realizado</button>
    <button class="htab" onclick="navTo('resumo')">📋 Resumo diário</button>
  </nav>
  <div class="hdr-right">
    <div class="presets" id="hdr-presets">
      <button class="btn-pre" onclick="applyQuickCurrent('hoje')">Hoje</button>
      <button class="btn-pre" onclick="applyQuickCurrent('ontem')">Ontem</button>
      <button class="btn-pre" onclick="applyQuickCurrent('7d')">7 dias</button>
      <button class="btn-pre on" onclick="applyQuickCurrent('30d')">30 dias</button>
      <button class="btn-pre" onclick="applyQuickCurrent('mes')">Este mês</button>
    </div>
    <div class="drbox">
      <span class="drbox-icon">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)"/>
    </div>
    <button class="btn-update" id="btn-update" onclick="loadData()">↻ Recarregar</button>
  </div>
</header>

<div class="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <nav class="hdr-tabs" id="subnav-captacao" style="display:none;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px"></nav>
  <div id="page-principal" class="page active"></div>
  <div id="page-anuncios"  class="page"></div>
  <div id="page-metricas"  class="page"></div>
  <div id="page-leads"     class="page"></div>
  <div id="page-aquecimento" class="page"></div>
  <div id="page-lembrete"  class="page"></div>
  <div id="page-aulas"     class="page"></div>
  <div id="page-carrinho"  class="page"></div>
  <div id="page-planoreal" class="page"></div>
  <div id="page-resumo"    class="page"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   OFRR — Captação de Leads — Dashboard (ofrr_ago26)
   Fonte de dados: planilha viva do Google Sheets, buscada em tempo real via
   endpoint público do Google Visualization API (gviz) — sem embutir CSV no
   HTML. A planilha precisa estar compartilhada como "qualquer pessoa com o
   link, leitor"; senão o fetch falha (401/403) e cai em S.error.
     • Base Meta - captação  → investimento/cliques/impressões por anúncio/dia
     • Base leads            → leads reais capturados no funil (quiz, faixa,
       origem via UTM, dados demográficos)

   Isolado do dashboard antigo (Carrinho) — este arquivo não altera o
   index.html da pasta anterior.

   Metas atualizadas conforme o "Resumo consolidado" combinado — 02/08/26.
   Investimento e Cadastros ainda não têm meta (planejamento por data vem
   depois); os demais alvos abaixo já são os valores reais do lançamento.
   ════════════════════════════════════════════════════════════════════════ */

// ── Fonte de dados: Google Sheets (planilha viva) ──────────────────────────
const SHEET_ID = "1fnYWDE3acNuIIgdq3wBmtD0-AAptf5EiB0ibyUfbXHE";
const SHEET_META_NAME = "Base Meta - captação";
const SHEET_LEADS_NAME = "Base leads";
const SHEET_AQUECIMENTO_NAME = "Base Meta - aquecimento";
const SHEET_LEMBRETE_NAME = "Base Meta - lembrete";
const SHEET_AULAS_NAME = "Base Meta - Aulas";
function sheetCsvUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}
async function fetchSheetCSV(sheetName){
  const res = await fetch(sheetCsvUrl(sheetName), {cache:"no-store"});
  if(!res.ok) throw new Error(`Falha ao buscar aba "${sheetName}" (HTTP ${res.status}) — confira se a planilha está compartilhada como "qualquer pessoa com o link"`);
  return await res.text();
}

// ── Metas do lançamento (Resumo consolidado 02/08/26) ──────────────────────
const META_CPL = 5.50;   // Custo por cadastro AC Tráfego — meta: menor é melhor
const METAS_RESUMO = {
  cpc:      {val:1.37,  higher:false}, // menor é melhor
  ctr:      {val:1.75,  higher:true},  // maior é melhor
  cpm:      {val:24.00, higher:false}, // menor é melhor
  quenteMorno:{val:20.00, higher:true},  // % público quente+morno — maior é melhor
  faixaA:   {val:28.00, higher:true},  // maior é melhor (tier mais qualificado)
  faixaB:   {val:24.00, higher:true},  // maior é melhor
  faixaC:   {val:37.00, higher:false}, // menor é melhor
  faixaD:   {val:11.00, higher:false}, // menor é melhor
  quiz:     {val:80.00, higher:true},  // Tx de resposta da pesquisa — maior é melhor
  txConvPg: {val:40.00, higher:true},  // Tx conv. Pg cadastro (aproximado: leads/cliques) — maior é melhor
  connectRate:{val:85.00, higher:true}, // ainda não computável (falta dado na Base Meta atual)
};

// ── Metas das etapas Aquecimento/Lembrete/Aulas (benchmarks de lançamentos
// anteriores) — valores fixos passados manualmente. Os modelos originais
// comparavam "meta de ontem"/"meta às 12h" (uma curva dia-a-dia do
// lançamento de benchmark), mas não temos o histórico diário completo desse
// benchmark aqui — por isso cada meta abaixo é um alvo único e fixo, não uma
// curva. Ajustar se/quando o histórico diário do benchmark existir.
const AQUECIMENTO_METAS = {
  cpc:       {val:3.34, higher:false}, // benchmark ofrr_jul25
  frequencia:{val:12.12,higher:true},
  tx75:      {val:3.8,  higher:true},
  cptx75:    {val:1.81, higher:false},
};
const LEMBRETE_METAS = {
  cpc:        {val:1.14, higher:false}, // benchmark ofrr_out25
  frequencia: {val:11.76,higher:true},
  likesJul25: {val:726,  higher:true},
  likesOut25: {val:756,  higher:true},
};
// Só a Aula 01 veio com metas de benchmark; Aula 02/03 aguardam metas
// específicas (mostradas sem farol/comparação até então).
const AULA01_METAS = {
  cpc:        {val:2.26, higher:false}, // benchmark ofrr_out25
  frequencia: {val:5.33, higher:true},
  likesJul25: {val:2325, higher:true},
  likesOut25: {val:1325, higher:true},
};

// ── Planejamento diário (passado manualmente pela planilha do lançamento) ──
// Cada linha: investimento e leads planejados para aquele dia. "leads" aqui é
// a mesma coisa que "Resultado planejado" na planilha (quantidade de leads).
// Leads planejados recalculados a partir do investimento diário ÷ meta de
// CPL (META_CPL = R$5,50) — é a mesma meta consolidada do lançamento, então
// o número de leads/dia acompanha a curva de investimento. Soma bate exato
// em 14.000 (77.000 ÷ 5,50).
const PLANO_DIARIO = [
  {date:"2026-08-02", investimento:5929,  leads:1078},
  {date:"2026-08-03", investimento:4851,  leads:882},
  {date:"2026-08-04", investimento:5775,  leads:1050},
  {date:"2026-08-05", investimento:6930,  leads:1260},
  {date:"2026-08-06", investimento:8316,  leads:1512},
  {date:"2026-08-07", investimento:9979,  leads:1814},
  {date:"2026-08-08", investimento:11975, leads:2177},
  {date:"2026-08-09", investimento:14370, leads:2613},
  {date:"2026-08-10", investimento:8875,  leads:1614},
];
// Soma do plano (Captação) até hoje — usado na aba Principal pros cartões
// "planejado até hoje" e "% atingimento da meta".
function planoAteHoje(){
  const today=todayISO();
  const ateHoje=PLANO_DIARIO.filter(p=>p.date<=today);
  return{
    investimento:ateHoje.reduce((a,p)=>a+p.investimento,0),
    leads:ateHoje.reduce((a,p)=>a+p.leads,0),
  };
}

// ── Planejamento das demais etapas do lançamento ────────────────────────────
// Passado manualmente a partir da planilha (só investimento — sem meta de
// leads pra essas etapas). Aquecimento não veio com detalhamento diário,
// só o total (R$ 0).
const PLANO_AQUECIMENTO = [];
const PLANO_AQUECIMENTO_TOTAL = 0;
const PLANO_LEMBRETE = [
  {date:"2026-08-03", investimento:0},
  {date:"2026-08-04", investimento:0},
  {date:"2026-08-05", investimento:0},
  {date:"2026-08-06", investimento:0},
  {date:"2026-08-07", investimento:0},
  {date:"2026-08-08", investimento:0},
  {date:"2026-08-09", investimento:453},
];
const PLANO_AULAS = [
  {date:"2026-08-10", investimento:1848},
  {date:"2026-08-11", investimento:1739},
  {date:"2026-08-12", investimento:1848},
];
const PLANO_CARRINHO = [
  {date:"2026-08-13", investimento:2387},
  {date:"2026-08-14", investimento:1771},
  {date:"2026-08-15", investimento:1155},
  {date:"2026-08-16", investimento:693},
  {date:"2026-08-17", investimento:693},
  {date:"2026-08-18", investimento:501},
  {date:"2026-08-19", investimento:501},
  {date:"2026-08-20", investimento:0},
];
function diaSemana(iso){
  const dias=["dom","seg","ter","qua","qui","sex","sáb"];
  const d=new Date(iso+"T12:00:00Z");
  return dias[d.getUTCDay()];
}

// Chart colors
const CHART_INV  = "#3b82f6";
const CHART_CPL  = "#fbbf24";
const CHART_LEAD = "#34d399";
const CHART_QUIZ = "#a78bfa";
const CHART_GAP  = "#f87171";
const CHART_FAIXA = {A:"#34d399",B:"#60a5fa",C:"#fbbf24",D:"#f87171"};
const CHART_RAMON = "#60a5fa";
const CHART_AD    = "#a78bfa";

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  meta:{},               // date → {spend,clicks,impressions,actionLeads,videoViews}
  metaRows:[],           // linhas planas da Base Meta: {date,adId,adName,campId,campName,adsetName,spend,clicks,impressions,actionLeads,videoViews,igUrl}
  adIdMap:{},            // adId → {adName,campName,campId,adsetName,igUrl}
  leadsRows:[],          // leads reais: {date,ms,quizOk,faixa,name,email,phone,utmSource,adName,campName,...demografia}
  leadsByDate:{},        // date → count (leads reais/dia)
  aquecimentoRows:[],    // linhas da Base Meta - aquecimento: {date,campName,adName,igUrl,spend,clicks,impressions,video75}
  lembreteRows:[],       // idem, Base Meta - lembrete
  aulasRows:[],          // idem, Base Meta - Aulas (uma ou mais campanhas por aula, ver aulaNumberFromCampaign)

// ── Date helpers (GMT-3 Brasil) ───────────────────────────────────────────
function nowBR(){ return new Date(Date.now()-(3*60*60*1000)); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowBR()); }
function yesterdayISO(){ const d=nowBR();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowBR();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowBR();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }

// ── Format helpers ────────────────────────────────────────────────────────
function parseBRL(s){
  if(!s||s==="-"||s==="0")return 0;
  s=String(s).replace(/[R$\s]/g,"").trim();
  if(!s||s==="-")return 0;
  if(s.includes(",")&&s.includes("."))return parseFloat(s.replace(/\./g,"").replace(",","."))||0;
  if(s.includes(","))return parseFloat(s.replace(",","."))||0;
  return parseFloat(s)||0;
}
function fBRL(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fBRLShort(n){ const a=Math.abs(n||0),sg=n<0?"-":"";if(a>=1000)return sg+"R$ "+(a/1000).toFixed(1).replace(".",",")+"k";return sg+"R$ "+Math.round(a); }
function fPct(n){ return (n||0).toFixed(2).replace(".",",")+"%"; }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"—";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function fDateTimeBR(ms){
  if(ms==null)return"—";
  const d=new Date(ms);
  return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
}
function toISO(s){
  if(!s||s==="Date"||s==="")return null;
  s=String(s).trim().split(" ")[0];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const p=s.split("/");
  if(p.length===3){
    const y=p[2].length===4?p[2]:"20"+p[2];
    const a=parseInt(p[0]),b=parseInt(p[1]);
    if(b>12){ return `${y}-${p[0].padStart(2,"0")}-${p[1].padStart(2,"0")}`; }
    return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  }
  return null;
}
function msToISO(ms){
  const d=new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}
// "created_at" das leads vem em UTC (sufixo Z). Ajusta -3h antes de definir o
// dia, mesma lógica usada no dash de Carrinho p/ "Submitted At" das fichas.
function toISOLead(s){
  if(!s)return null;
  const ms=Date.parse(s);
  if(isNaN(ms))return null;
  return {ms,date:msToISO(ms-3*60*60*1000)};
}

// ── Status helpers ────────────────────────────────────────────────────────
function statusColor(val,meta,higherIsBetter){
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.22)";
  if(c==="#fbbf24") return "rgba(251,191,36,.22)";
  if(c==="#f87171") return "rgba(248,113,113,.22)";
  return "var(--border)";
}

// ── CSV parser ────────────────────────────────────────────────────────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return result;
}
function parseRows(rows){
  if(rows.length<2)return[];
  const h=rows[0];
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}
// Parser genérico pras 3 bases de etapa (Aquecimento/Lembrete/Aulas) — todas
// têm o mesmo formato básico (Date, Campaign Name, Spend, Action Link
// Clicks, Impressions, Video 75%...), com pequenas variações de colunas que
// não usamos aqui (Cost per Inline Link Click é recalculado por nós mesmos,
// pra ficar consistente com o resto do dashboard).
function parseStageRows(rowsRaw){
  const out=[];
  for(const r of rowsRaw){
    const d=toISO(r["Date"]);if(!d)continue;
    const spend=parseBRL(r["Spend (Cost, Amount Spent)"]);
    const clicks=parseInt(r["Action Link Clicks"]||0)||0;
    const impressions=parseInt(r["Impressions"]||0)||0;
    const video75=parseInt(r["Video 75 Percent Watched Actions"]||0)||0;
    const campName=(r["Campaign Name"]||"").trim();
    const adName=(r["Ad Name"]||"").trim();
    const igUrl=(r["Instagram Permalink URL"]||"").trim();
    out.push({date:d,campName,adName,igUrl,spend,clicks,impressions,video75});
  }
  return out;
}

// ── Attribution helpers (UTM → anúncio/campanha do Meta Ads) ───────────────
// Padrão de UTM do Meta Ads exportado neste funil:
//   utm_medium  = "{nome campanha}id{campaign_id}"
//   utm_content = "{nome anúncio}id{ad_id}"
//   utm_term    = "{nome conjunto}id{adset_id}"
function extractIdSuffix(s){
  const m=String(s||"").match(/id(\d{10,})$/);
  return m?m[1]:null;
}
function extractNamePrefix(s){
  const m=String(s||"").match(/^(.+?)id\d{10,}$/);
  return m?m[1]:(s||null);
}
// Temperatura do público vem no NOME DA CAMPANHA (ex.: "...-conversao-quente-...",
// "...-conversao-frio-faixaAB_2.0-leva01") — não no campo "temperature_name" da
// Base leads, que nesta base vem sempre "Frio" independente da campanha real.
function campaignTemperature(campName){
  const c=String(campName||"").toLowerCase();
  if(c.includes("quente"))return "Quente";
  if(c.includes("morno"))return "Morno";
  if(c.includes("frio"))return "Frio";
  return "";
}
// Etapa do lançamento a que uma campanha pertence, extraída do NOME DA
// CAMPANHA (mesmo princípio da temperatura) — ex.: campanha de Lembrete
// contém "lembrete" no nome, Aquecimento contém "aquecimento", etc. Sem
// nenhuma dessas palavras, assume Captação (é a etapa atual do lançamento e
// a maioria das campanhas de hoje são dela). Usado pra não deixar o
// investimento de uma campanha vazar pro "realizado" de outra etapa só
// porque a data bate — cada real é filtrado por campanha, não só por data.
function campaignStage(campName){
  const c=String(campName||"").toLowerCase();
  if(c.includes("lembrete"))return "Lembrete";
  if(c.includes("aquecimento"))return "Aquecimento";
  if(c.includes("aula"))return "Aulas";
  if(c.includes("carrinho"))return "Carrinho";
  return "Captação";
}
// Investimento realizado de uma etapa numa data específica — soma só as
// linhas da Base Meta cuja campanha pertence àquela etapa (via
// campaignStage), não o gasto do dia inteiro.
function stageSpendForDate(stage,date){
  return S.metaRows.filter(r=>r.date===date&&campaignStage(r.campName)===stage).reduce((a,r)=>a+r.spend,0);
}
// Investimento realizado total de uma etapa (todas as datas) — usado no
// "Resumo por etapa" do Planejado/Realizado.
function totalSpendForStage(stage){
  return S.metaRows.filter(r=>campaignStage(r.campName)===stage).reduce((a,r)=>a+r.spend,0);
}

// Mesma lógica do metaEmoji() usado no Resumo diário (🟢/🟡/🔴/⚪), só que
// acessível globalmente pras novas abas de etapa (Aquecimento/Lembrete/Aulas).
function metaEmojiGlobal(val,meta,higherIsBetter){
  if(val==null) return "⚪";
  if(!val) return "🔴";
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399")return "🟢";
  if(c==="#fbbf24")return "🟡";
  return "🔴";
}
// Número da aula (1/2/3) a partir do nome da campanha — ex.: contém "aula01"
// ou "aula 1". null se não identificar nenhuma aula no nome.
function aulaNumberFromCampaign(campName){
  const c=String(campName||"").toLowerCase();
  const m=c.match(/aula\s*0?(\d)/);
  return m?m[1]:null;
}
function sumStageRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,video75:a.video75+r.video75}),
    {spend:0,clicks:0,impressions:0,video75:0});
}
// Métricas agregadas de uma etapa (Aquecimento/Lembrete/Aulas): CPC vem de
// spend/clicks (recalculado, não da coluna pronta do CSV, pra consistência
// com o resto do dashboard). Tx75%/CPtx75% usam Impressões como base (não
// temos "Video Plays" nessas bases) — ajustar se um dia existir esse dado.
function stageMetrics(rows){
  const t=sumStageRows(rows);
  const cpc=t.clicks>0?t.spend/t.clicks:null;
  const tx75=t.impressions>0?(t.video75/t.impressions)*100:null;
  const cptx75=t.video75>0?t.spend/t.video75:null;
  return{...t,cpc,tx75,cptx75};
}

// ── Load data ─────────────────────────────────────────────────────────────
async function loadData(){
  S.loading=true; S.error=null; render();
  try{
    const [metaCsv, leadsCsv] = await Promise.all([
      fetchSheetCSV(SHEET_META_NAME),
      fetchSheetCSV(SHEET_LEADS_NAME),
    ]);
    const metaRowsRaw = parseRows(parseCSVText(metaCsv));
    const leadsRowsRaw = parseRows(parseCSVText(leadsCsv));

    // ── Base Meta (investimento) ──
    const mD={}, metaRows=[], adIdMap={};
    for(const r of metaRowsRaw){
      const d=toISO(r["Date"]);if(!d)continue;
      const sp=parseBRL(r["Spend (Cost, Amount Spent)"]);
      const cl=parseInt(r["Action Link Clicks"]||0)||0;
      const im=parseInt(r["Impressions"]||0)||0;
      const al=parseInt(r["Action Leads"]||0)||0;
      const vv=parseInt(r["Action Video View"]||0)||0;
      const adId=(r["Ad ID"]||"").trim();
      const adName=(r["Ad Name"]||"").trim();
      const campId=(r["Campaign ID"]||"").trim();
      const campName=(r["Campaign Name"]||"").trim();
      const adsetName=(r["Adset Name"]||"").trim();
      const igUrl=(r["Instagram Permalink URL"]||"").trim();
      const platform=(r["Publisher Platform (Breakdown)"]||"").trim();

      if(!mD[d])mD[d]={spend:0,clicks:0,impressions:0,actionLeads:0,videoViews:0};
      mD[d].spend+=sp;mD[d].clicks+=cl;mD[d].impressions+=im;mD[d].actionLeads+=al;mD[d].videoViews+=vv;

      metaRows.push({date:d,adId,adName,campId,campName,adsetName,spend:sp,clicks:cl,impressions:im,actionLeads:al,videoViews:vv,igUrl,platform,
        temperatureName:campaignTemperature(campName)});

      if(adId&&!adIdMap[adId])adIdMap[adId]={adName,campName,campId,adsetName,igUrl};
      if(adId&&igUrl&&!adIdMap[adId].igUrl)adIdMap[adId].igUrl=igUrl;
    }

    // ── Leads reais (Base leads) ──
    const leadsRows=[], leadsByDate={};
    for(const r of leadsRowsRaw){
      const parsed=toISOLead(r["created_at"]);if(!parsed)continue;
      const {date,ms}=parsed;
      leadsByDate[date]=(leadsByDate[date]||0)+1;

      const utmMed=(r["utm_medium"]||"").trim();
      const utmCont=(r["utm_content"]||r["utm_term"]||"").trim();
      const rawAdId=extractIdSuffix(utmCont);
      const rawAdName=extractNamePrefix(utmCont);
      const rawCampName=extractNamePrefix(utmMed);

      let adName=rawAdName, campName=rawCampName;
      if(rawAdId&&adIdMap[rawAdId]){
        adName=adIdMap[rawAdId].adName||rawAdName;
        campName=adIdMap[rawAdId].campName||rawCampName;
      }
      if(!adName)adName="(sem atribuição)";
      if(!campName)campName="(sem atribuição)";

      // ── Canal (Tráfego × Orgânico) ──────────────────────────────────────
      // Critério pelo utm_source:
      //  • começa com "FBAds"  → Tráfego (Meta Ads, com UTM reconhecida)
      //  • vazio/em branco     → Tráfego sem UTM (ainda é tráfego pago — só
      //                          não veio com o parâmetro, por falha de
      //                          tracking; não é orgânico)
      //  • qualquer outro valor → Orgânico (fonte com nome próprio, ainda não
      //                          vista nesta base — ex.: disparo/lista/bio)
      // Hoje (02/08/26) a base só tem FBAds_* e vazio, então "organico"
      // fica em 0 até aparecer um utm_source de fato orgânico nos dados.
      const platformName=(r["platform_name"]||"").trim();
      const utmSourceRaw=(r["utm_source"]||"").trim();
      const hasUtm=utmSourceRaw.length>0;
      const channel=(!hasUtm||utmSourceRaw.startsWith("FBAds"))?"trafego":"organico";

      leadsRows.push({
        date,ms,
        quizOk:(r["Quiz respondido?"]||"").trim()==="Sim",
        faixa:(r["faixa"]||"").trim(),
        name:(r["name"]||"").trim(),
        email:(r["person_email"]||"").trim(),
        phone:(r["person_phone"]||"").trim(),
        utmSource:(r["utm_source"]||"").trim()||"(direto/sem utm)",
        platformName,channel,hasUtm,
        temperatureName:campaignTemperature(campName),
        conheceRamon:(r["Você conhece o Ramon Galimberti?"]||"").trim(),
        conheceAD:(r["Você conhece a Aliança Divergente?"]||"").trim(),
        adName,campName,
        idade:(r["Em qual faixa etária você se encaixa?"]||"").trim(),
        escolaridade:(r["Qual é o seu nível de escolaridade?"]||"").trim(),
        sexo:(r["Qual seu sexo?"]||"").trim(),
        estadoCivil:(r["Qual seu estado civil?"]||"").trim(),
        filhos:(r["Você tem filhos?"]||"").trim(),
        renda:(r["Qual das opções representa a sua renda mensal hoje?"]||"").trim(),
        trabalho:(r["Você trabalha como (marque o trabalho que te gera mais renda):"]||"").trim(),
      });
    }

    S.meta=mD; S.metaRows=metaRows; S.adIdMap=adIdMap;
    S.leadsRows=leadsRows; S.leadsByDate=leadsByDate;

    const allDates=[...new Set([...Object.keys(mD),...Object.keys(leadsByDate)])].sort();
    S.updated=allDates.length?fDateBR(allDates[allDates.length-1]):"—";

    if(!S.startDate){
      const first=allDates[0]||todayISO();
      S.startDate=first;S.endDate=todayISO();S.activeQuick="";
      // se o período de dados for curto, usa preset compatível; senão fica no range completo
      if(first>=nDaysAgoISO(29)){S.startDate=nDaysAgoISO(29);S.activeQuick="30d";}
    }
  }catch(e){
    S.error="Erro ao carregar dados do Google Sheets: "+e.message;
    console.error(e);
  }

  // Etapas Aquecimento/Lembrete/Aulas — buscadas à parte, num try/catch
  // próprio, pra uma aba nova ainda não existir/falhar não derrubar o resto
  // do dashboard (Captação, que já está rodando, continua funcionando).
  try{
    const [aquecimentoCsv, lembreteCsv, aulasCsv] = await Promise.all([
      fetchSheetCSV(SHEET_AQUECIMENTO_NAME),
      fetchSheetCSV(SHEET_LEMBRETE_NAME),
      fetchSheetCSV(SHEET_AULAS_NAME),
    ]);
    S.aquecimentoRows = parseStageRows(parseRows(parseCSVText(aquecimentoCsv)));
    S.lembreteRows = parseStageRows(parseRows(parseCSVText(lembreteCsv)));
    S.aulasRows = parseStageRows(parseRows(parseCSVText(aulasCsv)));
  }catch(e){
    console.error("Erro ao carregar dados das etapas (Aquecimento/Lembrete/Aulas):",e);
  }

  S.loading=false;
  render();
}

// ── Derived metrics ───────────────────────────────────────────────────────
// channel: "total" (tudo) | "trafego" (platform_name=Meta) | "organico" (sem UTM)
// Investimento só existe pro tráfego pago (é a única fonte de custo na Base
// Meta) — em "organico" o investimento é sempre 0; em "total" soma-se todo o
// gasto (blended) contra o total de leads (tráfego + orgânico).
function leadsForChannel(rows,channel){
  if(!channel||channel==="total")return rows;
  return rows.filter(l=>l.channel===channel);
}
// temp: "todos" | "quente" | "morno" | "frio" — comparado com a temperatura
// extraída do NOME DA CAMPANHA (ver campaignTemperature), tanto nos leads
// quanto nas linhas da Base Meta — isso permite filtrar investimento também,
// já que cada campanha do Meta Ads já nasce com a temperatura no nome.
function leadsForTemp(rows,temp){
  if(!temp||temp==="todos")return rows;
  const map={quente:"Quente",morno:"Morno",frio:"Frio"};
  return rows.filter(l=>l.temperatureName===map[temp]);
}
function sumMetaRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,actionLeads:a.actionLeads+r.actionLeads}),
    {spend:0,clicks:0,impressions:0,actionLeads:0});
}
// start/end = null → sem limite naquele lado (mesma convenção de leadsInRange)
function metaRowsFiltered(start,end,temp){
  let rows=S.metaRows.filter(r=>(start===null||r.date>=start)&&(end===null||r.date<=end));
  if(temp&&temp!=="todos"){
    const map={quente:"Quente",morno:"Morno",frio:"Frio"};
    rows=rows.filter(r=>r.temperatureName===map[temp]);
  }
  return rows;
}
function getDaily(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=sumMetaRows(metaRowsFiltered(date,date,temp));
    const dayLeadsAll=S.leadsRows.filter(l=>l.date===date);
    const leads=leadsForTemp(leadsForChannel(dayLeadsAll,channel),temp).length;
    const spend=channel==="organico"?0:m.spend;
    const actionLeads=m.actionLeads||0;
    // GAP % = diferença entre o que o gerenciador (Meta) reportou e os leads
    // reais da planilha, relativa aos leads reais. Positivo = Meta reportou
    // mais leads do que realmente caíram na planilha (duplicidade/atraso etc).
    const gapPct=leads>0?((actionLeads-leads)/leads)*100:null;
    return{date,label:fDate(date),spend,leads,actionLeads,gapPct,
      cpl:leads>0?spend/leads:0};
  });
}
// Séries diárias de qualidade (faixa/quiz/conhece Ramon-AD), % sempre sobre
// quem respondeu naquele dia especificamente (dias com poucos respondentes
// podem oscilar bastante — é esperado).
function getDailyQuality(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const q=qualityMetrics(date,date,channel,temp);
    return{date,label:fDate(date),...q};
  });
}
function getTotals(daily){
  return daily.reduce((a,d)=>({spend:a.spend+d.spend,leads:a.leads+d.leads}),{spend:0,leads:0});
}
// Investimento/leads/custo-lead da aba Principal, considerando os filtros de
// canal e temperatura. OBS: investimento/CPC/CTR/CPM só reagem ao canal — a
// Base Meta não segmenta gasto por temperatura de público, então filtrar por
// temperatura só restringe a contagem de leads/qualidade, não o investimento.
function principalTotals(start,end,channel,temp="todos"){
  // Gasto/cliques/impressões filtrados pela temperatura da campanha (nome da
  // campanha já indica quente/morno/frio) — não é mais um "blended" único.
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const leads=rows.length;
  const spend=channel==="organico"?0:m.spend;
  const cpl=(spend>0&&leads>0)?spend/leads:null;
  return{spend,leads,cpl,clicks:m.clicks,impressions:m.impressions,actionLeads:m.actionLeads};
}
// % de faixa/quiz/conhece-Ramon/conhece-AD — sempre sobre quem respondeu
// (não-resposta não entra no denominador), exceto a própria taxa de resposta
// do quiz, cujo denominador é o total de leads do canal/período.
function qualityMetrics(start,end,channel,temp="todos"){
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const total=rows.length;
  const quizRows=rows.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  const faixaPct=f=>quizRows.length>0?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const ramonRows=rows.filter(l=>l.conheceRamon==="Sim"||l.conheceRamon==="Não");
  const ramonPct=ramonRows.length>0?(ramonRows.filter(l=>l.conheceRamon==="Sim").length/ramonRows.length)*100:null;
  const adRows=rows.filter(l=>l.conheceAD==="Sim"||l.conheceAD==="Não");
  const adPct=adRows.length>0?(adRows.filter(l=>l.conheceAD==="Sim").length/adRows.length)*100:null;
  return{total,quizRespondidoN:quizRows.length,quizPct,
    faixaA:faixaPct("A"),faixaB:faixaPct("B"),faixaC:faixaPct("C"),faixaD:faixaPct("D"),
    ramonPct,ramonN:ramonRows.length,adPct,adN:adRows.length};
}
function fPctOrDash(v){ return v==null?"—":fPct(v); }
// Pacote de métricas usado no Resumo diário: sempre "total" (tráfego+orgânico),
// pois o resumo consolidado do lançamento não segmenta por canal.
function resumoMetrics(s,e){
  const per=periodTotals(s,e);
  const qm=qualityMetrics(s,e,"total");
  const rows=leadsInRange(s,e);
  const leadsTrafego=leadsForChannel(rows,"trafego").length;
  const leadsOrganico=leadsForChannel(rows,"organico").length;
  const quenteMornoRows=rows.filter(l=>l.temperatureName==="Quente"||l.temperatureName==="Morno");
  const quenteMornoPct=rows.length>0?(quenteMornoRows.length/rows.length)*100:null;
  // Tx conv Pg cadastro: aproximada por leads/cliques, já que a Base Meta
  // atual não traz "Landing Page Views" separado de "Link Clicks". Ajustar
  // se/quando esse dado passar a existir.
  const txConvPg=per.clicks>0?(per.leads/per.clicks)*100:null;
  // Custo por cadastro AC Tráfego: todo o gasto é pago (tráfego), então o
  // custo/lead "oficial" da meta é sobre os cadastros de tráfego — não o
  // blended (que dilui com orgânico, hoje sempre 0 leads).
  const cpl=leadsTrafego>0?per.spend/leadsTrafego:null;
  return{...per,...qm,leadsTrafego,leadsOrganico,cpl,quenteMornoPct,quenteMornoN:quenteMornoRows.length,txConvPg};
}
// s,e = null → todo o período (all-time)
function periodTotals(s,e){
  const dates=new Set([...Object.keys(S.leadsByDate),...Object.keys(S.meta)]);
  let leads=0,spend=0,clicks=0,impressions=0,actionLeads=0;
  for(const d of dates){
    if(s!==null&&d<s)continue;
    if(e!==null&&d>e)continue;
    leads+=S.leadsByDate[d]||0;
    const m=S.meta[d];
    if(m){ spend+=m.spend||0; clicks+=m.clicks||0; impressions+=m.impressions||0; actionLeads+=m.actionLeads||0; }
  }
  return{leads,spend,clicks,impressions,actionLeads,
    cpl:leads>0?spend/leads:0,
    cpc:clicks>0?spend/clicks:0,
    ctr:impressions>0?(clicks/impressions)*100:0,
    cpm:impressions>0?(spend/impressions)*1000:0};
}
// start/end = null → sem limite naquele lado (usado pelo "Total - Consolidado")
function leadsInRange(start,end){
  return S.leadsRows.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// ── Campanhas / Anúncios: agregação com cross-filtering ───────────────────
function getMetaRowsInRange(start,end){
  return S.metaRows.filter(r=>r.date>=start&&r.date<=end);
}
function getLeadsRowsForCamp(start,end,campName){
  return S.leadsRows.filter(l=>l.date>=start&&l.date<=end&&l.campName===campName);
}
function getLeadsRowsForAd(start,end,adName,campFilter){
  return S.leadsRows.filter(l=>{
    if(l.date<start||l.date>end)return false;
    if(l.adName!==adName)return false;
    if(campFilter&&campFilter.size>0&&!campFilter.has(l.campName))return false;
    return true;
  });
}
// % faixa (sobre quem respondeu o quiz) + % resposta da pesquisa (sobre todos
// os leads daquela campanha/anúncio) — mesma convenção usada na aba Principal.
function qualityFromLeadsArray(leadsArr){
  const total=leadsArr.length;
  const quizRows=leadsArr.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  const faixaPct=f=>quizRows.length>0?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  return{quizPct,faixaA:faixaPct("A"),faixaB:faixaPct("B"),faixaC:faixaPct("C"),faixaD:faixaPct("D")};
}
function getCampRows(start,end){
  const rows=getMetaRowsInRange(start,end);
  const byCamp={};
  for(const r of rows){
    const cn=r.campName||"(sem campanha)";
    if(!byCamp[cn])byCamp[cn]={campName:cn,spend:0,clicks:0,impressions:0,actionLeads:0};
    byCamp[cn].spend+=r.spend;byCamp[cn].clicks+=r.clicks;byCamp[cn].impressions+=r.impressions;byCamp[cn].actionLeads+=r.actionLeads;
  }
  return Object.values(byCamp).map(c=>{
    const leadsArr=getLeadsRowsForCamp(start,end,c.campName);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    return {...c,leads,...q,
      cpc:c.clicks>0?c.spend/c.clicks:0, ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      cpm:c.impressions>0?(c.spend/c.impressions)*1000:0, cpl:leads>0?c.spend/leads:0};
  });
}
function getAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=getMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName));
  const byAd={};
  for(const r of rows){
    const an=r.adName||"(sem anúncio)";
    if(!byAd[an])byAd[an]={adName:an,spend:0,clicks:0,impressions:0,actionLeads:0,igUrl:"",camps:new Set()};
    byAd[an].spend+=r.spend;byAd[an].clicks+=r.clicks;byAd[an].impressions+=r.impressions;byAd[an].actionLeads+=r.actionLeads;
    if(!byAd[an].igUrl&&r.igUrl)byAd[an].igUrl=r.igUrl;
    if(r.campName)byAd[an].camps.add(r.campName);
  }
  return Object.values(byAd).map(a=>{
    const leadsArr=getLeadsRowsForAd(start,end,a.adName,hasSel?selectedCamps:null);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    return {...a,leads,...q,campNames:[...a.camps].join(", "),
      cpc:a.clicks>0?a.spend/a.clicks:0, ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      cpm:a.impressions>0?(a.spend/a.impressions)*1000:0, cpl:leads>0?a.spend/leads:0};
  });
}

// ── Canvas / Chart helpers ────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  cssW=Math.max(cssW,50);cssH=Math.max(cssH,50);
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}
function drawDualInvCpl(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpl||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,META_CPL,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v)/(lMax))*cH;
  const yPR=v=>P.t+cH-((v)/(rMax))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  const mY=yPR(META_CPL);
  ctx.strokeStyle=CHART_CPL+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=CHART_CPL;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
  ctx.fillText("Meta R$"+META_CPL,P.l+cW+4,mY-3);
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPL,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function drawBars(ctx,xP,yP,yZero,vals,color,barW){
  vals.forEach((v,i)=>{
    const x=xP(i)-barW/2, y=Math.min(yP(v),yZero), h=Math.abs(yP(v)-yZero);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,Math.max(h,v>0?1:0));
  });
}
function drawBarSingle(id,data,key,color,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,color,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Barras (leads/dia, eixo esq.) + linha opcional de GAP% (gerenciador × planilha, eixo dir.)
function drawBarWithGap(id,data,barKey,gapKey,barColor,gapColor,cssW,cssH,showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:showGap?50:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[barKey]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,barColor,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  if(showGap){
    const gapVals=data.map(d=>d[gapKey]==null?0:d[gapKey]);
    const rMin=Math.min(0,...gapVals)*1.15;
    const rMax=Math.max(...gapVals,1)*1.15;
    const span=(rMax-rMin)||1;
    const yPR=v=>P.t+cH-((v-rMin)/span)*cH;
    for(let i=0;i<=4;i++){
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=gapColor;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
      ctx.fillText((rMax-(i/4)*span).toFixed(0)+"%",P.l+cW+4,y+3);
    }
    if(rMin<0){
      const zY=yPR(0);
      ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(P.l,zY);ctx.lineTo(P.l+cW,zY);ctx.stroke();ctx.setLineDash([]);
    }
    drawLineArea(ctx,xP,yPR,gapVals,gapColor,false);
  }
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Múltiplas linhas de % (0-100) — usado nas séries diárias de qualidade
// (Faixa A-D, Conhece Ramon/AD). Pontos nulos (sem resposta no dia) quebram
// a linha em vez de cair pra zero.
function drawMultiLine(id,data,series,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:36};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,Math.min(100,v))/100)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText((100-(i/4)*100).toFixed(0)+"%",P.l-4,y+3);
  }
  series.forEach(s=>{
    const vals=data.map(d=>d[s.key]);
    ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.setLineDash([]);
    let started=false;
    vals.forEach((v,i)=>{
      if(v==null){started=false;return;}
      if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
      else ctx.lineTo(xP(i),yP(v));
    });
    ctx.stroke();
    vals.forEach((v,i)=>{
      if(v==null)return;
      ctx.beginPath();ctx.fillStyle=s.color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
    });
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      const _v=d[l.key];
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${_v==null?"—":(l.fmt||fBRL)(+_v)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

function renderAnuncios(){

  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });

// ── Render: Leads (Qualidade) ──────────────────────────────────────────────
function distinctCount(rows,key){
  const c={};
  for(const r of rows){ const v=r[key]||"(não informado)"; c[v]=(c[v]||0)+1; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function setLeadsChannel(c){ S.leadsChannel=c; renderLeads(); }
function setLeadsTemp(t){ S.leadsTemp=t; renderLeads(); }
function leadsChannelToggle(){
  const CH=[["total","Total"],["trafego","Tráfego"],["organico","Orgânico"]];
  return `<div class="presets">${CH.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsChannel===k?" on":""}" onclick="setLeadsChannel('${k}')">${lbl}</button>`).join("")}</div>`;
}
function leadsTempToggle(){
  const TP=[["todos","Todos"],["quente","Quente"],["morno","Morno"],["frio","Frio"]];
  return `<div class="presets">${TP.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsTemp===k?" on":""}" onclick="setLeadsTemp('${k}')">${lbl}</button>`).join("")}</div>`;
}
function renderLeads(){
  const el=document.getElementById("page-leads");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const ch=S.leadsChannel, temp=S.leadsTemp;
  const chLabel={total:"Total",trafego:"Tráfego",organico:"Orgânico"}[ch];
  const tempLabel={todos:"Todos",quente:"Quente",morno:"Morno",frio:"Frio"}[temp];
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),ch),temp);
  const quizRows=rows.filter(l=>l.quizOk);
  const total=rows.length;
  const quizPct=total>0?(quizRows.length/total)*100:0;

  const faixaOrder=["A","B","C","D"];
  const faixaColors={A:"#34d399",B:"#60a5fa",C:"#fbbf24",D:"#f87171"};
  const faixaCounts=faixaOrder.map(f=>({f,n:quizRows.filter(l=>l.faixa===f).length}));

  const origemCounts=distinctCount(rows,"utmSource").slice(0,10);
  const maxOrigem=origemCounts.length?origemCounts[0][1]:1;

  function demoBlock(title,key){
    const counts=distinctCount(quizRows,key).slice(0,8);
    const maxV=counts.length?counts[0][1]:1;
    return `<div class="cc">
      <div class="ch"><span class="ct">${title}</span></div>
      ${counts.map(([k,n])=>barRow(k,n,quizRows.length,"#60a5fa")).join("")}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Análise qualificação</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${total} leads no período · canal: ${chLabel} · temperatura: ${tempLabel}</div>
      </div>
    </div>
    <div style="margin-bottom:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Canal:</span>${leadsChannelToggle()}</div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Temperatura:</span>${leadsTempToggle()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Leads no período",total.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Quiz respondido",fPct(quizPct),`${quizRows.length} de ${total}`,"var(--text-strong)")}
      ${kpiCard("Faixa A (melhor score)",faixaCounts[0].n.toLocaleString("pt-BR"),quizRows.length>0?fPct((faixaCounts[0].n/quizRows.length)*100):"—","#34d399")}
      ${kpiCard("Faixa D (pior score)",faixaCounts[3].n.toLocaleString("pt-BR"),quizRows.length>0?fPct((faixaCounts[3].n/quizRows.length)*100):"—","#f87171")}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="cc">
        <div class="ch"><span class="ct">Distribuição por faixa (score do quiz)</span></div>
        ${faixaCounts.map(({f,n})=>barRow("Faixa "+f,n,quizRows.length,faixaColors[f])).join("")}
      </div>
      <div class="cc">
        <div class="ch"><span class="ct">Origem (utm_source)</span></div>
        ${origemCounts.map(([k,n])=>barRow(k,n,maxOrigem>0?rows.length:0,"#a78bfa")).join("")}
      </div>
    </div>

    <div class="section-lbl">Perfil demográfico (entre quem respondeu o quiz)</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px">
      ${demoBlock("Faixa etária","idade")}
      ${demoBlock("Sexo","sexo")}
      ${demoBlock("Estado civil","estadoCivil")}
      ${demoBlock("Escolaridade","escolaridade")}
      ${demoBlock("Renda mensal","renda")}
      ${demoBlock("Ocupação","trabalho")}
    </div>
    <div class="foot">OFRR · Captação · dados locais (CSV embutido)</div>`;
}

// ── Render: Resumo diário ──────────────────────────────────────────────────
// Plano (Captação) de um dia específico — usado no Resumo diário pra
// comparar Ontem/Hoje contra a linha daquele dia na planilha de planejamento.
// Retorna null se a data estiver fora do período planejado (ex.: antes do
// lançamento começar ou depois do fim da Captação).
function planForDate(dateISO){
  return PLANO_DIARIO.find(p=>p.date===dateISO)||null;
}
// Meta total do lançamento (soma do plano inteiro, não só até hoje) — usada
// só pro "% de atingimento" do bloco Total-Consolidado do Resumo diário.
function planoTotalLancamento(){
  return{
    investimento:PLANO_DIARIO.reduce((a,p)=>a+p.investimento,0),
    leads:PLANO_DIARIO.reduce((a,p)=>a+p.leads,0),
  };
}
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const _fid=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();

  const ontem=resumoMetrics(yest,yest);
  const hojeRaw=resumoMetrics(today,today);
  const isManual=S.manualSpendHoje!==null;

  const hoje=isManual
    ? {...hojeRaw, spend:S.manualSpendHoje,
        cpl:hojeRaw.leadsTrafego>0?S.manualSpendHoje/hojeRaw.leadsTrafego:null}
    : hojeRaw;

  let tot=resumoMetrics(null,null);
  if(isManual){
    const adjSpend=tot.spend-hojeRaw.spend+S.manualSpendHoje;
    tot={...tot, spend:adjSpend,
      cpl:tot.leadsTrafego>0?adjSpend/tot.leadsTrafego:null};
  }

  function cplInfo(m){
    if(!m.leadsTrafego||m.cpl==null) return {txt:"--", emoji:"🔴"};
    const ratio=META_CPL/m.cpl;
    let emoji="🔴";
    if(ratio>=1)emoji="🟢";else if(ratio>=0.85)emoji="🟡";
    return {txt:fBRL(m.cpl),emoji};
  }
  function metaEmoji(val,meta,higherIsBetter){
    if(val==null) return "⚪";
    if(!val) return "🔴";
    const c=statusColor(val,meta,higherIsBetter);
    if(c==="#34d399")return "🟢";
    if(c==="#fbbf24")return "🟡";
    return "🔴";
  }

  function row(lbl,val,metaStr,emoji){
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-strong)">${val}</span>
      <span style="font-size:14px;min-width:90px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaStr||""}</span></span>
    </div>`;
  }
  function investRowHoje(plan){
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">Investimento</span>
      <input id="manual-spend-input"
        value="${isManual?(hoje.spend||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}"
        placeholder="${fBRL(hojeRaw.spend)}"
        inputmode="decimal"
        oninput="setManualSpendHoje(this.value)"
        onkeydown="if(event.key==='Enter')this.blur()"
        style="font-family:'JetBrains Mono',monospace;font-size:13px;color:${isManual?'#fbbf24':'var(--text-strong)'};background:transparent;border:none;border-bottom:1px solid ${isManual?'rgba(251,191,36,.4)':'rgba(255,255,255,.15)'};outline:none;padding:2px 0;width:100%"/>
      <span style="font-size:11px;min-width:90px;text-align:right">
        ${isManual?`<button onclick="clearManualSpendHoje()" style="font-size:10px;padding:3px 9px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fbbf24;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:""}
        ${plan?`<div style="font-size:10px;color:var(--hint);margin-top:3px">plan.: ${fBRL(plan.investimento)}</div>`:""}
      </span>
    </div>`;
  }
  function block(title,m,isHoje,dateLbl,plan,atingimentoPlan){
    const c=cplInfo(m);
    const pctAtingimento=(atingimentoPlan&&atingimentoPlan.leads>0)?(m.leads/atingimentoPlan.leads)*100:null;
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;font-weight:700;color:var(--text-strong)">${title}</span>
        ${dateLbl?`<span style="font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace">${dateLbl}</span>`:""}
      </div>
      ${isHoje?investRowHoje(plan):row("Investimento",fBRL(m.spend),plan?`plan.: ${fBRL(plan.investimento)}`:"sem plano p/ este período","")}
      ${row("Cadastros no AC Tráfego",m.leadsTrafego,plan?`plan.: ${plan.leads.toLocaleString("pt-BR")}`:"sem plano p/ este período","")}
      ${row("Custo por cadastro AC Tráfego",c.txt,`🎯 ${fBRL(META_CPL)}`,c.emoji)}
      <div style="height:6px"></div>
      ${row("Cadastros no AC Orgânico",m.leadsOrganico,"","")}
      ${row("Cadastros no AC Total",m.leads,pctAtingimento!=null?`atingimento: ${fPct(pctAtingimento)}`:"","")}
      <div style="height:10px"></div>
      ${row("% público quente + morno",fPctOrDash(m.quenteMornoPct),`🎯 ${METAS_RESUMO.quenteMorno.val}%`,metaEmoji(m.quenteMornoPct,METAS_RESUMO.quenteMorno.val,METAS_RESUMO.quenteMorno.higher))}
      <div style="height:10px"></div>
      ${row("Faixa A",fPctOrDash(m.faixaA),`🎯 ${METAS_RESUMO.faixaA.val}%`,metaEmoji(m.faixaA,METAS_RESUMO.faixaA.val,METAS_RESUMO.faixaA.higher))}
      ${row("Faixa B",fPctOrDash(m.faixaB),`🎯 ${METAS_RESUMO.faixaB.val}%`,metaEmoji(m.faixaB,METAS_RESUMO.faixaB.val,METAS_RESUMO.faixaB.higher))}
      ${row("Faixa C",fPctOrDash(m.faixaC),`🎯 ${METAS_RESUMO.faixaC.val}%`,metaEmoji(m.faixaC,METAS_RESUMO.faixaC.val,METAS_RESUMO.faixaC.higher))}
      ${row("Faixa D",fPctOrDash(m.faixaD),`🎯 ${METAS_RESUMO.faixaD.val}%`,metaEmoji(m.faixaD,METAS_RESUMO.faixaD.val,METAS_RESUMO.faixaD.higher))}
      <div style="height:10px"></div>
      ${row("Conhece Ramon",fPctOrDash(m.ramonPct),"sem meta","")}
      ${row("Conhece AD",fPctOrDash(m.adPct),"sem meta","")}
      <div style="height:10px"></div>
      ${row("Tx de resp. pesquisa",fPctOrDash(m.quizPct),`🎯 ${METAS_RESUMO.quiz.val}%`,metaEmoji(m.quizPct,METAS_RESUMO.quiz.val,METAS_RESUMO.quiz.higher))}
      <div style="height:10px"></div>
      ${row("CPC",fBRL(m.cpc),`🎯 ${fBRL(METAS_RESUMO.cpc.val)}`,metaEmoji(m.cpc,METAS_RESUMO.cpc.val,METAS_RESUMO.cpc.higher))}
      ${row("CTR",fPct(m.ctr),`🎯 ${METAS_RESUMO.ctr.val}%`,metaEmoji(m.ctr,METAS_RESUMO.ctr.val,METAS_RESUMO.ctr.higher))}
      ${row("CPM",fBRL(m.cpm),`🎯 ${fBRL(METAS_RESUMO.cpm.val)}`,metaEmoji(m.cpm,METAS_RESUMO.cpm.val,METAS_RESUMO.cpm.higher))}
      <div style="height:10px"></div>
      ${row("Tx conv Pg cadastro",fPctOrDash(m.txConvPg),`🎯 ${METAS_RESUMO.txConvPg.val}% · aprox. leads/cliques 🔧`,metaEmoji(m.txConvPg,METAS_RESUMO.txConvPg.val,METAS_RESUMO.txConvPg.higher))}
      ${row("Connect Rate","—",`🎯 ${METAS_RESUMO.connectRate.val}% · dado indisponível na Base Meta 🔧`,"⚪")}

// ── Render: Métricas do Tráfego (placeholder — conteúdo a definir) ─────────
// Métricas de tráfego (CPC/CTR/CPM/Tx Pág→Cadastro/Connect Rate), filtráveis
// só por temperatura (extraída do nome da campanha) — não tem filtro de canal
// porque é tudo tráfego pago (a única fonte de investimento na Base Meta).
function trafficMetrics(start,end,temp){
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const leads=leadsForTemp(leadsInRange(start,end),temp).length;
  const cpl=leads>0?m.spend/leads:null;
  const cpc=m.clicks>0?m.spend/m.clicks:null;
  const ctr=m.impressions>0?(m.clicks/m.impressions)*100:null;
  const cpm=m.impressions>0?(m.spend/m.impressions)*1000:null;
  // Tx Pág → Cadastro: aproximada por leads/cliques (Base Meta atual não
  // separa Landing Page Views de Link Clicks — mesma aproximação do Resumo).
  const txConvPg=m.clicks>0?(leads/m.clicks)*100:null;
  return{spend:m.spend,leads,cpl,cpc,ctr,cpm,txConvPg};
}
function getDailyTraffic(start,end,temp){
  const dates=new Set(Object.keys(S.meta));
  return Array.from(dates).sort().filter(d=>d>=start&&d<=end).map(date=>({date,label:fDate(date),...trafficMetrics(date,date,temp)}));
}

// Linha única de uma métrica ao longo do tempo, com escala dinâmica (baseada
// no próprio dado + na meta) e linha tracejada de meta — mesmo padrão visual
// do gráfico dual de Investimento×Custo/lead da aba Principal.
function drawMetricLine(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.2;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  let started=false;
  vals.forEach((v,i)=>{
    if(v==null){started=false;return;}
    if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
    else ctx.lineTo(xP(i),yP(v));
  });
  ctx.stroke();
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.beginPath();ctx.fillStyle=color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Gráfico "vazio" — só grade + linha tracejada de meta + aviso de dado
// indisponível. Usado pro Connect Rate, que ainda não existe na Base Meta
// atual; fica aqui como lembrete visual de que a métrica falta.
function drawEmptyMetricLine(id,cssW,cssH,metaVal,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const max=(metaVal||1)*1.3;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=P.t+cH-(metaVal/max)*cH;
    ctx.strokeStyle=CHART_RAMON+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_RAMON;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  ctx.fillStyle=TICK_C;ctx.font="11px 'DM Sans',sans-serif";ctx.textAlign="center";
  ctx.fillText("Sem dado disponível na Base Meta atual",P.l+cW/2,P.t+cH/2+4);
}

      stageManualRow(`manual-likes-aula0${aulaNum}-out25`,`Likes na aula0${aulaNum} (bench out25)`,likesOut25,`setManualLikes('${likesOut25Key}',this.value)`,metas?`manual 🔧 · Meta: ${metas.likesOut25.val.toLocaleString("pt-BR")}`:"manual 🔧 · sem meta ainda",metas&&likesOut25?metaEmojiGlobal(likesOut25,metas.likesOut25.val,metas.likesOut25.higher):"⚪")
    )}
    ${block("Total",
      stageRow("Investimento total",fBRL(m.spend),"","")+

      stageManualRow(`manual-alcance-aula0${aulaNum}`,"Alcance FB",alcance,`setManualAlcance('${alcanceKey}',this.value)`,"manual 🔧 (API não fornece)","")+
      stageRow("Frequência FB",freq!=null?freq.toFixed(2).replace(".",","):"—",metas?`Meta: ${metas.frequencia.val}`:"sem meta ainda",metas?(freq!=null?metaEmojiGlobal(freq,metas.frequencia.val,metas.frequencia.higher):"⚪"):"")
